name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    name: Build & Verify Multi-Arch Launchers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            binary: lowkey
          - os: darwin
            arch: amd64
            binary: lowkey
          - os: linux
            arch: amd64
            binary: lowkey
          - os: linux
            arch: arm64
            binary: lowkey
          - os: windows
            arch: amd64
            binary: lowkey.exe
          - os: windows
            arch: arm64
            binary: lowkey.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Verify compilation for ${{ matrix.os }}/${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.os }}-${{ matrix.arch }}/${{ matrix.binary }} .
